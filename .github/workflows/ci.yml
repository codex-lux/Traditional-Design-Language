name: CI

# Three kinds of job because they fail for different reasons and at different speeds. The
# corpus suite is the slow, authoritative one; the workbench job is fast feedback on the
# things a deploy can break. Railway's "Wait for CI" gate watches both.
#
# THE CORPUS SUITE IS A MATRIX AND WAS ONE STEP UNTIL 7 SEP 2026 (WP-11.12). It had reached
# 39 min 32 s -- measured on run 33908079938, against eight minutes for the workbench job and
# one for the image, so it WAS the wall-clock of a pull request, and Phase 11 then took it
# past 41. Measured before it was split: `pytest tests/` 2,070 s against 197 s for the 44
# checkers. Nothing in it is slow; 2,267 s of independent work was running on one core.
#
# `build/check_all.py --shard i/N` partitions the work. SIX, and the number is measured
# rather than chosen: the makespan is bounded below by the largest INDIVISIBLE unit, and
# tests/test_score.py is 422 s on its own (measured HERE, on a runner that held it alone),
# so six shards land 422 s and a seventh buys nothing.
#
# MEASURED, TWICE. Run 34162261372: the whole run 11 min 17 s against the single job's
# 39 min 32 s -- a 3.5x cut, not the sixfold the local costs predicted, because
# build/check_costs.json had been measured on a 4-core container and its TOTAL was right to
# 0.2% while its DISTRIBUTION was four minutes wrong. Re-costed from that run, and run
# 34163342215 then measured the re-costing: 10 min 3 s against a predicted 7.5, makespan
# 571 s against 421. THE SECOND INSTRUMENT HAD THE FIRST'S DEFECT ONE LEVEL DOWN -- scaling
# every file by its shard's measured/predicted ratio makes each shard's TOTAL right BY
# CONSTRUCTION and leaves the shape inside it as assumed as before (shard 1, one unit and an
# exact figure: +4%; shard 3, whose largest file carried a spread one: +37%). The figures are
# pytest's own now, per file, via --junitxml; see per_file_seconds() and the report's §VI-b.
# The same work also summed 2,499 s then 2,675 s on two runs, so no table is right to better
# than 7% and the flat spot is a band. Re-measure with
# `python3 build/check_all.py --list-units --shard 1/N` before changing N; the balance is a
# property of the corpus, not of the number.
#
# THE SPLIT IS BY JOB, WHICH IS THE POINT. Six test files mutate repository data in place and
# restore it in a `finally`; a thread- or xdist-parallel suite in one checkout would let one
# worker read `assets/manifest.json` while another has it truncated. Each shard is its own
# runner with its own checkout, and inside a shard the tests run serially in one pytest
# process exactly as before, so nothing about the suite's isolation changes.
#
# `corpus — check_all.py` still exists, as an aggregate that needs every shard. The name is
# kept deliberately: it is what a branch-protection rule or Railway's gate is configured
# against, and renaming a required check silently stops requiring it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Its own job rather than a step inside the matrix: it needs both refs and it answers the
  # same for every shard, so running it six times would be six chances to hit GitHub's
  # rate limit for one answer.
  ids:
    name: open-question ids
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: open-question ids do not collide with the base branch
        run: bash .github/scripts/oq_ids_do_not_collide.sh "${{ github.base_ref }}"

  shard:
    name: corpus shard ${{ matrix.shard }}/6
    runs-on: ubuntu-latest
    strategy:
      # Every shard runs even when one fails. A red shard that cancelled the other five
      # would hide any second failure -- the same reason check_all.py runs everything after
      # a failure rather than stopping at the first one.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Node, because two of check_all's checkers now need it and BOTH go quiet without it.
      # `check_gazetteer.py` runs `gazetteer.js` rather than keeping a second copy of the
      # placement algorithm in Python, and `check_frontend.py` runs the router and search
      # suites. Absent node they exit 3 — COULD NOT EVALUATE, which check_all correctly
      # declines to treat as a failure — so this job would have gone green with the gazetteer
      # ratchet and 74 frontend checks never run. That is the same shape as the walk that
      # "ran nowhere while CLAUDE.md described it as a guard", noted twenty lines below.
      # No npm install: neither checker needs a package, only the runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        # The corpus itself has no dependencies; these are the checkers' own.
        #
        # ortools, because without it an entire subsystem's guards were decorative here.
        # `tests/test_solver.py` opens with `pytest.importorskip("ortools")`, so the whole
        # file was skipped inside a `pytest tests/` that then reported OK, and
        # `geometry_cp.py selftest` sat beside it as COULD NOT EVALUATE. The CP solver — its
        # hard-fact fixtures, its proven-infeasible K5 refusal, and the downgrade pin that
        # was rewritten and mutation-proved on 26 Aug — had never once run in CI. The
        # workbench job below does install ortools, but runs only the server suite.
        # Costs an install and about two minutes of solver tests. Ruled worth it.
        run: pip install jsonschema pytest ortools
      - name: check_all.py --shard ${{ matrix.shard }}/6
        # Reports the workbench server suite as N/EV here — fastapi is deliberately not
        # installed in this job, and the workbench job below runs it properly. Only ONE
        # shard holds that unit, so only one shard's log carries the line.
        #
        # AND NOTHING OUTSIDE THE ALLOWLIST MAY BE N/EV. check_all reports COULD NOT
        # EVALUATE distinctly and does not fail on it, which is right: an absent optional
        # library is not a failing test. But that is exactly how a checker goes quiet — this
        # job went green with the gazetteer ratchet and 74 frontend checks never run, for
        # want of a runtime nobody had noticed they needed.
        #
        # The guard is a NAMED LIST, not a count. The first version of it asserted "at most
        # one" and failed immediately at four, because I had guessed the baseline instead of
        # reading it: ezdxf, ifcopenshell and fastapi are all absent here too, every one of
        # them documented as optional. A number would also have missed the case that matters
        # — a legitimate absence appearing while a real one disappears keeps the total the
        # same. Naming them says which absences this job accepts and why, and anything else
        # reporting unjudged is a checker that did not run behind a tick claiming it had.
        # A LIST SURVIVES SHARDING AND A COUNT WOULD NOT: which of the three lands in this
        # shard depends on the cost table, so "at most three" would have to be re-derived
        # per shard from a hint.
        #
        # The two CAD libraries stay out on purpose: their selftests are exercised in the
        # workbench job, which installs them. Run once, not twice — the suite is minutes.
        run: |
          set -o pipefail
          python3 build/check_all.py --shard ${{ matrix.shard }}/6 2>&1 | tee /tmp/ca.log
          allowed='export_dxf.py selftest|export_ifc.py selftest|pytest workbench/server/tests'
          if grep '^  N/EV' /tmp/ca.log | grep -Ev "$allowed"; then
            echo "::error::a check reported COULD NOT EVALUATE that this job expects to judge."
            echo "Allowed unjudged here: $allowed"
            exit 1
          fi
          echo "Every check outside the allowlist was judged."

  # THE NAME IS LOAD-BEARING. Branch protection and Railway's "Wait for CI" gate are
  # configured against `corpus — check_all.py`, and a required check that stops existing
  # stops being required — silently, which is this repository's whole catalogue of defects
  # in one sentence. So the matrix runs under a different name and this aggregates it.
  #
  # `needs` alone is not enough: a needed job that FAILS skips this one, and a skipped job
  # is not a failed one to a protection rule. The `if: always()` plus the explicit result
  # test is what makes a red shard a red gate.
  corpus:
    name: corpus — check_all.py
    runs-on: ubuntu-latest
    needs: shard
    if: always()
    steps:
      - name: every shard was green
        run: |
          echo "shard job result: ${{ needs.shard.result }}"
          test "${{ needs.shard.result }}" = "success"

  workbench:
    name: workbench — server tests + app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app is built FIRST, on purpose. test_example_plan_no_traversal asserts that a
      # traversal URL lands on the SPA catch-all and gets index.html — and app.py only
      # mounts that catch-all when workbench/app/dist exists. Run pytest against an
      # unbuilt tree and that test fails for a reason that has nothing to do with the
      # change under test.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workbench/app/package-lock.json
      - name: Install app deps
        run: npm ci
        working-directory: workbench/app
      - name: Build app
        # The Dockerfile runs this same build; a break here is a break in the image.
        run: npm run build
        working-directory: workbench/app
      - name: App suite
        # The candidate ordering and the reasons-list rendering live in pure modules with
        # their own node --test suite. build/check_all.py runs it too, reporting N/EV where
        # node is absent; here node is always present, so a failure is a failure.
        run: npm test
        working-directory: workbench/app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Precompress assets (the image does this; the suite asserts it works)
        run: python3 workbench/scripts/precompress.py workbench/app/dist
      - name: Install server deps
        # Both files: the runtime set is what the image ships, and requirements-dev.txt
        # adds pytest and httpx, which used to be in the runtime file and so were being
        # built into production. If the suite ever fails here for a missing package that
        # the image does not need, it belongs in the dev file rather than back in the other.
        run: pip install -r workbench/requirements.txt -r workbench/requirements-dev.txt
      - name: Server tests
        run: python3 -m pytest workbench/server/tests -q

      - name: Smoke — HTTP results match the CLI's own
        run: bash workbench/scripts/smoke.sh

      # The walk is the only thing that measures the DRAWINGS: that no room label leaves
      # the room it names, that the order stands as one stack drawn to its stated height
      # at the right datum, that the loupe magnifies and that a wall handle still keeps
      # its own drag. It ran nowhere until 26 Aug 2026, while CLAUDE.md described it as a
      # guard — a guarantee nobody enforced. It runs here now.
      - name: Install Playwright's chromium
        run: npx playwright install --with-deps chromium
        working-directory: workbench/app
      - name: Walk every surface and measure the plates
        run: bash workbench/scripts/walk.sh

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        # Proves the two-stage build still works before Railway attempts it.
        run: docker build -t tdl-workbench .
