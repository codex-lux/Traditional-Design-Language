name: CI

# Two jobs because they fail for different reasons and at different speeds. The corpus
# suite is the slow, authoritative one (~3 min); the workbench job is fast feedback on
# the things a deploy can break. Railway's "Wait for CI" gate watches both.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    name: corpus — check_all.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        # The corpus itself has no dependencies; these are the checkers' own.
        run: pip install jsonschema pytest
      - name: check_all.py
        # Reports the workbench suite as SKIP here — fastapi is deliberately not
        # installed in this job, and the workbench job below runs it properly.
        run: python3 build/check_all.py

  workbench:
    name: workbench — server tests + app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app is built FIRST, on purpose. test_example_plan_no_traversal asserts that a
      # traversal URL lands on the SPA catch-all and gets index.html — and app.py only
      # mounts that catch-all when workbench/app/dist exists. Run pytest against an
      # unbuilt tree and that test fails for a reason that has nothing to do with the
      # change under test.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workbench/app/package-lock.json
      - name: Install app deps
        run: npm ci
        working-directory: workbench/app
      - name: Build app
        # The Dockerfile runs this same build; a break here is a break in the image.
        run: npm run build
        working-directory: workbench/app
      - name: App suite
        # The candidate ordering and the reasons-list rendering live in pure modules with
        # their own node --test suite. build/check_all.py runs it too, reporting N/EV where
        # node is absent; here node is always present, so a failure is a failure.
        run: npm test
        working-directory: workbench/app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install server deps
        run: pip install -r workbench/requirements.txt
      - name: Server tests
        run: python3 -m pytest workbench/server/tests -q

      - name: Smoke — HTTP results match the CLI's own
        run: bash workbench/scripts/smoke.sh

      # workbench/app/e2e/walk.mjs has asserted 28 honesty affordances across all eleven
      # surfaces since WP-5.2 and NOTHING RAN IT — not this file, not the Makefile, not
      # check_all.py. Found on 26 Aug 2026 when a caption changed and the walk turned out
      # to be pinning the stale per-style fault count that change removed: an assertion
      # nobody executes protects nothing and quietly certifies whatever is there.
      - name: Install Playwright
        # --no-save on purpose: `npm ci` above has already verified the lockfile, and the
        # walk is the only thing that wants a browser. Adding playwright to package.json
        # would put a ~300 MB devDependency in front of every contributor's install.
        # BOTH lines are needed: the second installs a browser, the first installs the
        # module walk.mjs imports. Installing only the browser leaves `require('playwright')`
        # with nothing to find.
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.49
          npx playwright install --with-deps chromium
        working-directory: workbench/app
      - name: E2E — every surface loads and keeps its honesty affordances
        # Repo root, NOT workbench/app: `python3 -m uvicorn workbench.server.app:app` needs
        # the `workbench` package importable, and from workbench/app it is not. The server is
        # backgrounded, so the health probe must be able to FAIL — a `for` loop that ends in
        # `sleep 0.5` returns 0 whether or not the server ever came up, and the step would
        # then fail thirty seconds later inside the walk with a connection error naming
        # nothing. walk.mjs resolves both playwright and its screenshot directory relative to
        # its own file, so running it by path from here is correct.
        run: |
          python3 -m uvicorn workbench.server.app:app --host 127.0.0.1 --port 8177 \
            --log-level error &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8177/api/health >/dev/null && break
            sleep 0.5
          done
          curl -sf http://127.0.0.1:8177/api/health >/dev/null \
            || { echo "the workbench server never came up — see the log above"; exit 1; }
          node workbench/app/e2e/walk.mjs

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        # Proves the two-stage build still works before Railway attempts it.
        run: docker build -t tdl-workbench .
