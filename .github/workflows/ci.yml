name: CI

# Two jobs because they fail for different reasons and at different speeds. The corpus
# suite is the slow, authoritative one (~3 min); the workbench job is fast feedback on
# the things a deploy can break. Railway's "Wait for CI" gate watches both.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  corpus:
    name: corpus — check_all.py
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Node, because two of check_all's checkers now need it and BOTH go quiet without it.
      # `check_gazetteer.py` runs `gazetteer.js` rather than keeping a second copy of the
      # placement algorithm in Python, and `check_frontend.py` runs the router and search
      # suites. Absent node they exit 3 — COULD NOT EVALUATE, which check_all correctly
      # declines to treat as a failure — so this job would have gone green with the gazetteer
      # ratchet and 74 frontend checks never run. That is the same shape as the walk that
      # "ran nowhere while CLAUDE.md described it as a guard", noted twenty lines below.
      # No npm install: neither checker needs a package, only the runtime.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        # The corpus itself has no dependencies; these are the checkers' own.
        #
        # ortools, because without it an entire subsystem's guards were decorative here.
        # `tests/test_solver.py` opens with `pytest.importorskip("ortools")`, so the whole
        # file was skipped inside a `pytest tests/` that then reported OK, and
        # `geometry_cp.py selftest` sat beside it as COULD NOT EVALUATE. The CP solver — its
        # hard-fact fixtures, its proven-infeasible K5 refusal, and the downgrade pin that
        # was rewritten and mutation-proved on 26 Aug — had never once run in CI. The
        # workbench job below does install ortools, but runs only the server suite.
        # Costs an install and about two minutes of solver tests. Ruled worth it.
        run: pip install jsonschema pytest ortools
      # THE ONLY PLACE A CROSS-BRANCH ID COLLISION IS DETECTABLE BEFORE IT COSTS A RENUMBER.
      # Four collisions in four days, every one found at the merge and paid for afterwards with
      # a sweep of ~1,500 references. `pull_request` gives us both refs, so the SECOND pull
      # request to issue an id can be failed before it lands rather than renumbered after.
      #
      # The register being a directory is most of the fix, but not all of it: two sessions
      # issuing id 99 with DIFFERENT slugs create two different PATHS, so git merges both
      # without a conflict and the register carries two entries numbered 99. check_ids.py
      # catches that within one tree; this catches it across two.
      - name: open-question ids do not collide with the base branch
        if: github.event_name == 'pull_request'
        run: |
          set -o pipefail
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          BASE="origin/${{ github.base_ref }}"
          files () { git ls-tree -r --name-only "$1" -- docs/open-questions/ 2>/dev/null | sort; }
          ids () { files "$1" | sed -n 's#.*/\([0-9][0-9][0-9]\)-.*\.md#\1#p' | sort -u; }
          # THE SET TO WALK IS THE INTERSECTION, NOT THE DIFFERENCE. The first version of this
          # step walked ids this branch ADDED (base \ head reversed) and then asked for the
          # BASE's file for that id -- non-empty only when the id is already in base, which is
          # exactly what `added` excludes. Unsatisfiable on every iteration; the gate could not
          # fire, and said "no collision" for the one case it exists to catch. A collision is
          # an id BOTH sides carry under DIFFERENT filenames, so the population is `comm -12`.
          # This also holds on a `pull_request` checkout, which is the MERGE commit: HEAD then
          # carries both files, the id is in both sets, and the filename lists differ.
          both=$(comm -12 <(ids "$BASE") <(ids HEAD))
          collide=""
          for id in $both; do
            b=$(files "$BASE" | grep -E "/${id}-" || true)
            h=$(files HEAD   | grep -E "/${id}-" || true)
            if [ "$b" != "$h" ]; then collide="$collide $id"; fi
          done
          if [ -n "$collide" ]; then
            echo "::error::open-question id(s)$collide exist on ${{ github.base_ref }} under a"
            echo "different filename. Another session issued them first. Reissue this branch's"
            echo "under a NAMED id (docs/open-questions/oq-<slug>.md) and add a row to"
            echo "docs/open-questions/README.md's conversion table. PLAN-OF-ACTION.md §1: ids"
            echo "are never reused, and the side that merged first keeps its numbers."
            exit 1
          fi
          # The named namespace needs no comparison of its own: filename IS the id, so two
          # sessions raising `oq-<slug>.md` have derived the same slug from the same subject
          # and the conflict git refuses to auto-merge is the one you want. That is the whole
          # point of freezing the numbers -- see docs/open-questions/oq-two-id-namespaces.md.
          echo "No open-question id on this branch collides with ${{ github.base_ref }}."

      - name: check_all.py
        # Reports the workbench server suite as N/EV here — fastapi is deliberately not
        # installed in this job, and the workbench job below runs it properly.
        #
        # AND NOTHING OUTSIDE THE ALLOWLIST MAY BE N/EV. check_all reports COULD NOT
        # EVALUATE distinctly and does not fail on it, which is right: an absent optional
        # library is not a failing test. But that is exactly how a checker goes quiet — this
        # job went green with the gazetteer ratchet and 74 frontend checks never run, for
        # want of a runtime nobody had noticed they needed.
        #
        # The guard is a NAMED LIST, not a count. The first version of it asserted "at most
        # one" and failed immediately at four, because I had guessed the baseline instead of
        # reading it: ezdxf, ifcopenshell and fastapi are all absent here too, every one of
        # them documented as optional. A number would also have missed the case that matters
        # — a legitimate absence appearing while a real one disappears keeps the total the
        # same. Naming them says which absences this job accepts and why, and anything else
        # reporting unjudged is a checker that did not run behind a tick claiming it had.
        #
        # The two CAD libraries stay out on purpose: their selftests are exercised in the
        # workbench job, which installs them. Run once, not twice — the suite is minutes.
        run: |
          set -o pipefail
          python3 build/check_all.py 2>&1 | tee /tmp/ca.log
          allowed='export_dxf.py selftest|export_ifc.py selftest|pytest workbench/server/tests'
          if grep '^  N/EV' /tmp/ca.log | grep -Ev "$allowed"; then
            echo "::error::a check reported COULD NOT EVALUATE that this job expects to judge."
            echo "Allowed unjudged here: $allowed"
            exit 1
          fi
          echo "Every check outside the allowlist was judged."

  workbench:
    name: workbench — server tests + app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The app is built FIRST, on purpose. test_example_plan_no_traversal asserts that a
      # traversal URL lands on the SPA catch-all and gets index.html — and app.py only
      # mounts that catch-all when workbench/app/dist exists. Run pytest against an
      # unbuilt tree and that test fails for a reason that has nothing to do with the
      # change under test.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: workbench/app/package-lock.json
      - name: Install app deps
        run: npm ci
        working-directory: workbench/app
      - name: Build app
        # The Dockerfile runs this same build; a break here is a break in the image.
        run: npm run build
        working-directory: workbench/app
      - name: App suite
        # The candidate ordering and the reasons-list rendering live in pure modules with
        # their own node --test suite. build/check_all.py runs it too, reporting N/EV where
        # node is absent; here node is always present, so a failure is a failure.
        run: npm test
        working-directory: workbench/app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Precompress assets (the image does this; the suite asserts it works)
        run: python3 workbench/scripts/precompress.py workbench/app/dist
      - name: Install server deps
        # Both files: the runtime set is what the image ships, and requirements-dev.txt
        # adds pytest and httpx, which used to be in the runtime file and so were being
        # built into production. If the suite ever fails here for a missing package that
        # the image does not need, it belongs in the dev file rather than back in the other.
        run: pip install -r workbench/requirements.txt -r workbench/requirements-dev.txt
      - name: Server tests
        run: python3 -m pytest workbench/server/tests -q

      - name: Smoke — HTTP results match the CLI's own
        run: bash workbench/scripts/smoke.sh

      # The walk is the only thing that measures the DRAWINGS: that no room label leaves
      # the room it names, that the order stands as one stack drawn to its stated height
      # at the right datum, that the loupe magnifies and that a wall handle still keeps
      # its own drag. It ran nowhere until 26 Aug 2026, while CLAUDE.md described it as a
      # guard — a guarantee nobody enforced. It runs here now.
      - name: Install Playwright's chromium
        run: npx playwright install --with-deps chromium
        working-directory: workbench/app
      - name: Walk every surface and measure the plates
        run: bash workbench/scripts/walk.sh

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        # Proves the two-stage build still works before Railway attempts it.
        run: docker build -t tdl-workbench .
